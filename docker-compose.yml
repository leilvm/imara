version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: imara_db
      POSTGRES_USER: imara
      POSTGRES_PASSWORD: imara_dev_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://imara:imara_dev_pass@db:5432/imara_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A imara_project worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://imara:imara_dev_pass@db:5432/imara_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      - db
      - redis

volumes:
  postgres_data: